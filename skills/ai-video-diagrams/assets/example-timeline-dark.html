<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#181b24; --paper-2:#20242f; --card:#232836;
  --ink:#e8eaf1; --muted:#9da5b8; --soft:#757d92;
  --rule:rgba(232,234,241,0.13); --rule-solid:rgba(157,165,184,0.30);
  --accent:#7b73f0; --accent-tint:rgba(123,115,240,0.14);
  --link:#3aa3c6; --ok:#5fae74; --danger:#d06363;
  --ink-05:rgba(232,234,241,0.05); --ink-03:rgba(232,234,241,0.03);
  --ink-02:rgba(232,234,241,0.02); --ink-30:rgba(232,234,241,0.30); --ink-20:rgba(232,234,241,0.20);
  --muted-10:rgba(157,165,184,0.10); --ok-08:rgba(95,174,116,0.08); --danger-08:rgba(208,99,99,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Production timeline, eight weeks in three phases">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Production timeline · 8 weeks</text>

  <!-- phase bands -->
  <rect class="stage" x="100" y="250" width="320" height="140" rx="8"/>
  <text class="eyebrow" x="116" y="238">Pre-pro</text>
  <rect class="stage" x="420" y="250" width="340" height="140" rx="8"/>
  <text class="eyebrow" x="436" y="238">Production</text>
  <rect class="stage" x="760" y="250" width="340" height="140" rx="8"/>
  <text class="eyebrow" x="776" y="238">Post &amp; delivery</text>

  <!-- baseline -->
  <line x1="100" y1="400" x2="1100" y2="400" stroke="var(--rule-solid)" stroke-width="1.5"/>

  <!-- now marker -->
  <line class="focal" x1="520" y1="250" x2="520" y2="620"/>
  <text class="arrow-label" x="528" y="246" fill="var(--accent)">now</text>

  <!-- events -->
  <circle cx="150" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="150" y="434" text-anchor="middle">Brief</text>
  <text class="sublabel" x="150" y="450" text-anchor="middle">w1</text>
  <circle cx="280" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="280" y="434" text-anchor="middle">Style frames</text>
  <text class="sublabel" x="280" y="450" text-anchor="middle">w2–3</text>
  <circle cx="480" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="480" y="434" text-anchor="middle">First takes</text>
  <text class="sublabel" x="480" y="450" text-anchor="middle">w4</text>
  <circle cx="600" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="600" y="434" text-anchor="middle">Client review</text>
  <text class="sublabel" x="600" y="450" text-anchor="middle">w5</text>
  <circle cx="780" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="780" y="434" text-anchor="middle">Edit</text>
  <text class="sublabel" x="780" y="450" text-anchor="middle">w6</text>
  <circle cx="900" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="900" y="434" text-anchor="middle">Grade</text>
  <text class="sublabel" x="900" y="450" text-anchor="middle">w7</text>
  <circle cx="1040" cy="400" r="5" fill="var(--ink)"/>
  <text class="node-name" x="1040" y="434" text-anchor="middle">Deliver</text>
  <text class="sublabel" x="1040" y="450" text-anchor="middle">w8</text>

  <text class="sublabel" x="100" y="430" text-anchor="middle">w1</text>
  <text class="sublabel" x="1100" y="430" text-anchor="middle">w8</text>

  <text class="callout" x="40" y="660">Bands are phases, dots are commitments. Keep the dots honest.</text>
</svg>
</body>
</html>
