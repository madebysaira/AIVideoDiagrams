<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sequence — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#181b24; --paper-2:#20242f; --card:#232836;
  --ink:#e8eaf1; --muted:#9da5b8; --soft:#757d92;
  --rule:rgba(232,234,241,0.13); --rule-solid:rgba(157,165,184,0.30);
  --accent:#7b73f0; --accent-tint:rgba(123,115,240,0.14);
  --link:#3aa3c6; --ok:#5fae74; --danger:#d06363;
  --ink-05:rgba(232,234,241,0.05); --ink-03:rgba(232,234,241,0.03);
  --ink-02:rgba(232,234,241,0.02); --ink-30:rgba(232,234,241,0.30); --ink-20:rgba(232,234,241,0.20);
  --muted-10:rgba(157,165,184,0.10); --ok-08:rgba(95,174,116,0.08); --danger-08:rgba(208,99,99,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Sequence diagram of the render handoff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Sequence · render handoff</text>

  <!-- actors -->
  <rect class="node" x="120" y="60" width="160" height="56" rx="6"/>
  <text class="node-name" x="200" y="84" text-anchor="middle">Pipeline</text>
  <text class="sublabel" x="200" y="102" text-anchor="middle">your automation</text>
  <rect class="focal" x="460" y="60" width="160" height="56" rx="6"/>
  <text class="node-name" x="540" y="84" text-anchor="middle">n8n</text>
  <text class="sublabel" x="540" y="102" text-anchor="middle">orchestrator</text>
  <rect class="external" x="800" y="60" width="160" height="56" rx="6"/>
  <text class="node-name" x="880" y="84" text-anchor="middle">Model API</text>
  <text class="sublabel" x="880" y="102" text-anchor="middle">Kling · Veo · Runway</text>

  <!-- lifelines -->
  <line class="edge-thin" x1="200" y1="116" x2="200" y2="680" stroke-dasharray="2,4"/>
  <line class="edge-thin" x1="540" y1="116" x2="540" y2="680" stroke-dasharray="2,4"/>
  <line class="edge-thin" x1="880" y1="116" x2="880" y2="680" stroke-dasharray="2,4"/>

  <!-- messages -->
  <path class="edge" d="M200,160 L540,160" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="370" y="152" text-anchor="middle">POST /webhook/generate</text>
  <path class="edge-accent" d="M540,220 L880,220" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="710" y="212" text-anchor="middle">POST /v1/videos · seed + refs</text>
  <path class="edge" d="M880,280 L540,280" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="710" y="272" text-anchor="middle">202 accepted · job_id</text>
  <path class="edge" d="M540,340 L200,340" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="370" y="332" text-anchor="middle">callback · job queued</text>

  <!-- generation gap -->
  <rect class="optional" x="430" y="372" width="220" height="36" rx="6"/>
  <text class="sublabel" x="540" y="395" text-anchor="middle">generation runs ≈ 90s</text>

  <path class="edge-link" d="M540,440 L880,440" marker-end="url(#arrow-link)"/>
  <text class="arrow-label" x="710" y="432" text-anchor="middle">GET /v1/videos/{id} · poll 30s ×4</text>
  <path class="edge-link" d="M880,500 L540,500" marker-end="url(#arrow-link)"/>
  <text class="arrow-label" x="710" y="492" text-anchor="middle">ready · asset_url</text>
  <path class="edge" d="M540,560 L200,560" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="370" y="552" text-anchor="middle">webhook · render ready</text>

  <text class="callout" x="40" y="660">The API is a machine; the orchestration is where the taste lives.</text>
</svg>
</body>
</html>
