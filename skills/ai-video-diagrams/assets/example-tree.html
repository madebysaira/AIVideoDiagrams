<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tree — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Project tree for one client spot">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Project tree · one client spot</text>

  <!-- root -->
  <rect class="focal" x="500" y="80" width="200" height="56" rx="6"/>
  <text class="node-name" x="600" y="104" text-anchor="middle">Client spot · Tanishq</text>
  <text class="sublabel" x="600" y="122" text-anchor="middle">8 weeks · one team</text>

  <!-- level 1 connectors -->
  <path class="edge" d="M600,136 L600,200 L275,200 L275,260" marker-end="url(#arrow)"/>
  <path class="edge" d="M600,136 L600,260" marker-end="url(#arrow)"/>
  <path class="edge" d="M600,136 L600,200 L925,200 L925,260" marker-end="url(#arrow)"/>

  <!-- level 1 -->
  <rect class="node" x="200" y="260" width="150" height="56" rx="6"/>
  <text class="node-name" x="275" y="284" text-anchor="middle">Script</text>
  <text class="sublabel" x="275" y="302" text-anchor="middle">w1–2</text>
  <rect class="node" x="500" y="260" width="150" height="56" rx="6"/>
  <text class="node-name" x="575" y="284" text-anchor="middle">Assets</text>
  <text class="sublabel" x="575" y="302" text-anchor="middle">art · footage · audio</text>
  <rect class="node" x="850" y="260" width="150" height="56" rx="6"/>
  <text class="node-name" x="925" y="284" text-anchor="middle">Delivery</text>
  <text class="sublabel" x="925" y="302" text-anchor="middle">master · captions</text>

  <!-- level 2 connectors -->
  <path class="edge" d="M275,316 L275,368 L190,368 L190,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M275,316 L275,368 L350,368 L350,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M575,316 L575,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M575,316 L575,368 L735,368 L735,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M575,316 L575,368 L895,368 L895,420" marker-end="url(#arrow)"/>
  <path class="edge" d="M925,316 L925,368 L1045,368 L1045,420" marker-end="url(#arrow)"/>

  <!-- level 2 -->
  <rect class="input" x="120" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="190" y="444" text-anchor="middle">Beat sheet</text>
  <text class="sublabel" x="190" y="462" text-anchor="middle">w1</text>
  <rect class="input" x="280" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="350" y="444" text-anchor="middle">VO script</text>
  <text class="sublabel" x="350" y="462" text-anchor="middle">w2</text>
  <rect class="input" x="505" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="575" y="444" text-anchor="middle">Characters</text>
  <text class="sublabel" x="575" y="462" text-anchor="middle">bible locked</text>
  <rect class="input" x="665" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="735" y="444" text-anchor="middle">Footage</text>
  <text class="sublabel" x="735" y="462" text-anchor="middle">takes</text>
  <rect class="input" x="825" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="895" y="444" text-anchor="middle">Music</text>
  <text class="sublabel" x="895" y="462" text-anchor="middle">licensed</text>
  <rect class="input" x="975" y="420" width="140" height="56" rx="6"/>
  <text class="node-name" x="1045" y="444" text-anchor="middle">Client drive</text>
  <text class="sublabel" x="1045" y="462" text-anchor="middle">mp4 + masters</text>

  <!-- level 3 connectors -->
  <path class="edge" d="M735,476 L735,528 L660,528 L660,580" marker-end="url(#arrow)"/>
  <path class="edge" d="M735,476 L735,528 L800,528 L800,580" marker-end="url(#arrow)"/>
  <path class="edge" d="M735,476 L735,528 L940,528 L940,580" marker-end="url(#arrow)"/>

  <!-- level 3 -->
  <rect class="store" x="600" y="580" width="120" height="56" rx="6"/>
  <text class="node-name" x="660" y="604" text-anchor="middle">take-01</text>
  <text class="sublabel" x="660" y="622" text-anchor="middle">5s · 4K</text>
  <rect class="store" x="740" y="580" width="120" height="56" rx="6"/>
  <text class="node-name" x="800" y="604" text-anchor="middle">take-02</text>
  <text class="sublabel" x="800" y="622" text-anchor="middle">5s · 4K</text>
  <rect class="store" x="880" y="580" width="120" height="56" rx="6"/>
  <text class="node-name" x="940" y="604" text-anchor="middle">take-03</text>
  <text class="sublabel" x="940" y="622" text-anchor="middle">5s · 4K</text>

  <text class="callout" x="40" y="700">Three levels deep is a document, not a diagram.</text>
</svg>
</body>
</html>
