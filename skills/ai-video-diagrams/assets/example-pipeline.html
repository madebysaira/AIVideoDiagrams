<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="AI video production pipeline: script, pre-viz, generate, post, deliver">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">AI video pipeline · client spot</text>

  <!-- stage containers -->
  <rect class="stage" x="40" y="140" width="190" height="420" rx="8"/>
  <rect class="stage" x="270" y="140" width="190" height="420" rx="8"/>
  <rect class="stage" x="500" y="140" width="190" height="420" rx="8"/>
  <rect class="stage" x="730" y="140" width="190" height="420" rx="8"/>
  <rect class="stage" x="960" y="140" width="190" height="420" rx="8"/>

  <text class="eyebrow" x="56" y="168">01 · script</text>
  <text class="eyebrow" x="286" y="168">02 · pre-viz</text>
  <text class="eyebrow" x="516" y="168">03 · generate</text>
  <text class="eyebrow" x="746" y="168">04 · post</text>
  <text class="eyebrow" x="976" y="168">05 · deliver</text>

  <!-- connectors (draw under nodes) -->
  <path class="edge" d="M135,256 L135,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M210,348 L255,348 L255,228 L290,228" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="258" y="220">beats + refs</text>
  <path class="edge" d="M135,256 L135,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M210,348 L480,348 L480,228 L520,228" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="345" y="340">seed frames</text>
  <path class="edge" d="M135,256 L135,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M670,348 L720,348 L720,228 L750,228" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="695" y="340">clips + takes</text>
  <path class="edge" d="M135,256 L135,320" marker-end="url(#arrow)"/>
  <path class="edge" d="M900,348 L980,348" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="940" y="340">master + files</text>

  <!-- stage 1 -->
  <rect class="input" x="60" y="200" width="150" height="56" rx="6"/>
  <text class="node-name" x="135" y="224" text-anchor="middle">Client brief</text>
  <text class="sublabel" x="135" y="242" text-anchor="middle">deck · 15s spot</text>
  <rect class="node" x="60" y="320" width="150" height="56" rx="6"/>
  <text class="node-name" x="135" y="344" text-anchor="middle">Script</text>
  <text class="sublabel" x="135" y="362" text-anchor="middle">beats · VO · shot list</text>

  <!-- stage 2 -->
  <rect class="node" x="290" y="200" width="150" height="56" rx="6"/>
  <text class="node-name" x="365" y="224" text-anchor="middle">Storyboard</text>
  <text class="sublabel" x="365" y="242" text-anchor="middle">6 key frames</text>
  <rect class="node" x="290" y="320" width="150" height="56" rx="6"/>
  <text class="node-name" x="365" y="344" text-anchor="middle">Style frames</text>
  <text class="sublabel" x="365" y="362" text-anchor="middle">palette · grade refs</text>

  <!-- stage 3 -->
  <rect class="node" x="520" y="200" width="150" height="56" rx="6"/>
  <text class="node-name" x="595" y="224" text-anchor="middle">Image gen</text>
  <text class="sublabel" x="595" y="242" text-anchor="middle">Kling · 1024×576</text>
  <rect class="focal" x="520" y="320" width="150" height="56" rx="6"/>
  <text class="node-name" x="595" y="344" text-anchor="middle">Video gen</text>
  <text class="sublabel" x="595" y="362" text-anchor="middle">Veo 3.1 · 5s takes</text>

  <!-- stage 4 -->
  <rect class="node" x="750" y="200" width="150" height="56" rx="6"/>
  <text class="node-name" x="825" y="224" text-anchor="middle">Edit</text>
  <text class="sublabel" x="825" y="242" text-anchor="middle">timeline · captions</text>
  <rect class="node" x="750" y="320" width="150" height="56" rx="6"/>
  <text class="node-name" x="825" y="344" text-anchor="middle">Grade</text>
  <text class="sublabel" x="825" y="362" text-anchor="middle">look · sound mix</text>

  <!-- stage 5 -->
  <rect class="node" x="980" y="320" width="150" height="56" rx="6"/>
  <text class="node-name" x="1055" y="344" text-anchor="middle">Client package</text>
  <text class="sublabel" x="1055" y="362" text-anchor="middle">4K master · mp4</text>

  <text class="callout" x="40" y="650">The generate stage turns ideas into footage. Everything upstream exists to feed it.</text>
</svg>
</body>
</html>
