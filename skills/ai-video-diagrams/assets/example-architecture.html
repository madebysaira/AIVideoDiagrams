<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Studio architecture: automation core, model APIs, delivery">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Studio architecture · one-person pipeline</text>

  <!-- inputs -->
  <rect class="input" x="40" y="60" width="150" height="56" rx="6"/>
  <text class="node-name" x="115" y="84" text-anchor="middle">Client brief</text>
  <text class="sublabel" x="115" y="102" text-anchor="middle">deck · references</text>
  <path class="edge" d="M115,116 L115,160" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="123" y="142">brief</text>
  <rect class="input" x="220" y="60" width="150" height="56" rx="6"/>
  <text class="node-name" x="295" y="84" text-anchor="middle">Source footage</text>
  <text class="sublabel" x="295" y="102" text-anchor="middle">brand clips · r3d</text>
  <path class="edge" d="M295,116 L295,160" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="303" y="142">footage</text>

  <!-- studio core -->
  <rect class="stage" x="40" y="160" width="760" height="360" rx="8"/>
  <text class="eyebrow" x="56" y="188">Studio core</text>

  <rect class="focal" x="320" y="300" width="200" height="56" rx="6"/>
  <text class="node-name" x="420" y="324" text-anchor="middle">n8n automation</text>
  <text class="sublabel" x="420" y="342" text-anchor="middle">orchestrates · retries · webhooks</text>

  <rect class="store" x="560" y="220" width="150" height="56" rx="6"/>
  <text class="node-name" x="635" y="244" text-anchor="middle">Prompt templates</text>
  <text class="sublabel" x="635" y="262" text-anchor="middle">bible · locked</text>
  <path class="edge" d="M520,316 L540,316 L540,248 L560,248" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="547" y="282">prompts</text>

  <rect class="store" x="560" y="380" width="150" height="56" rx="6"/>
  <text class="node-name" x="635" y="404" text-anchor="middle">Asset storage</text>
  <text class="sublabel" x="635" y="422" text-anchor="middle">takes · masters</text>
  <path class="edge" d="M520,340 L540,340 L540,408 L560,408" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="547" y="382">read/write</text>

  <rect class="node" x="160" y="380" width="150" height="56" rx="6"/>
  <text class="node-name" x="235" y="404" text-anchor="middle">QC &amp; review</text>
  <text class="sublabel" x="235" y="422" text-anchor="middle">approval gates</text>

  <!-- model apis -->
  <rect class="external" x="830" y="220" width="150" height="56" rx="6"/>
  <text class="node-name" x="905" y="244" text-anchor="middle">Image API</text>
  <text class="sublabel" x="905" y="262" text-anchor="middle">Midjourney · FLUX</text>
  <rect class="external" x="830" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="905" y="324" text-anchor="middle">Video API</text>
  <text class="sublabel" x="905" y="342" text-anchor="middle">Kling · Veo · Runway</text>
  <rect class="external" x="830" y="380" width="150" height="56" rx="6"/>
  <text class="node-name" x="905" y="404" text-anchor="middle">Audio API</text>
  <text class="sublabel" x="905" y="422" text-anchor="middle">ElevenLabs</text>

  <path class="edge" d="M520,328 L780,328"/>
  <line class="edge" x1="780" y1="248" x2="780" y2="408"/>
  <path class="edge" d="M780,248 L830,248" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,328 L830,328" marker-end="url(#arrow)"/>
  <path class="edge" d="M780,408 L830,408" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="650" y="320">HTTPS · webhook</text>

  <!-- delivery -->
  <rect class="external" x="40" y="560" width="150" height="56" rx="6"/>
  <text class="node-name" x="115" y="584" text-anchor="middle">Client drive</text>
  <text class="sublabel" x="115" y="602" text-anchor="middle">SFTP · rclone</text>
  <path class="edge" d="M235,520 L235,540 L115,540 L115,560" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="175" y="532">deliver</text>
  <rect class="external" x="220" y="560" width="150" height="56" rx="6"/>
  <text class="node-name" x="295" y="584" text-anchor="middle">CDN</text>
  <text class="sublabel" x="295" y="602" text-anchor="middle">Vimeo · social</text>
  <path class="edge" d="M295,520 L295,560" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="303" y="542">push</text>

  <text class="callout" x="40" y="680">The automation core is the only thing with a keyboard.</text>
</svg>
</body>
</html>
