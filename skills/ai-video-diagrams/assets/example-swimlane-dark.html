<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swimlane — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#181b24; --paper-2:#20242f; --card:#232836;
  --ink:#e8eaf1; --muted:#9da5b8; --soft:#757d92;
  --rule:rgba(232,234,241,0.13); --rule-solid:rgba(157,165,184,0.30);
  --accent:#7b73f0; --accent-tint:rgba(123,115,240,0.14);
  --link:#3aa3c6; --ok:#5fae74; --danger:#d06363;
  --ink-05:rgba(232,234,241,0.05); --ink-03:rgba(232,234,241,0.03);
  --ink-02:rgba(232,234,241,0.02); --ink-30:rgba(232,234,241,0.30); --ink-20:rgba(232,234,241,0.20);
  --muted-10:rgba(157,165,184,0.10); --ok-08:rgba(95,174,116,0.08); --danger-08:rgba(208,99,99,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Swimlane diagram: client, studio, AI tools">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Production swimlane · client spot</text>

  <!-- lanes -->
  <rect class="stage" x="40" y="70" width="1120" height="150" rx="0"/>
  <rect class="stage" x="40" y="220" width="1120" height="220" rx="0"/>
  <rect class="stage" x="40" y="440" width="1120" height="240" rx="0"/>
  <text class="eyebrow" x="52" y="150">Client</text>
  <text class="eyebrow" x="52" y="330">Studio</text>
  <text class="eyebrow" x="52" y="560">AI tools</text>

  <!-- connectors -->
  <path class="edge" d="M215,166 L215,250 L340,250 L340,300" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="277" y="242">brief → studio</text>
  <path class="edge" d="M490,328 L540,328" marker-end="url(#arrow)"/>
  <path class="edge" d="M615,356 L615,430 L515,430 L515,540" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="565" y="422">handoff</text>
  <path class="edge" d="M590,568 L640,568" marker-end="url(#arrow)"/>
  <path class="edge" d="M715,540 L715,480 L815,480 L815,356" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="765" y="472">loop until approved</text>
  <path class="edge" d="M815,300 L815,230 L695,230 L695,166" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="755" y="222">approve / notes</text>
  <path class="edge-thin" d="M740,340 L690,340" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="715" y="332">notes</text>

  <!-- client lane -->
  <rect class="input" x="140" y="110" width="150" height="56" rx="6"/>
  <text class="node-name" x="215" y="134" text-anchor="middle">Brief</text>
  <text class="sublabel" x="215" y="152" text-anchor="middle">deck · budget · dates</text>
  <rect class="focal" x="620" y="110" width="150" height="56" rx="6"/>
  <text class="node-name" x="695" y="134" text-anchor="middle">Approve</text>
  <text class="sublabel" x="695" y="152" text-anchor="middle">one sign-off, written</text>

  <!-- studio lane -->
  <rect class="node" x="340" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="415" y="324" text-anchor="middle">Concept</text>
  <text class="sublabel" x="415" y="342" text-anchor="middle">look + script</text>
  <rect class="node" x="540" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="615" y="324" text-anchor="middle">Generate</text>
  <text class="sublabel" x="615" y="342" text-anchor="middle">takes · seeds</text>
  <rect class="node" x="740" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="815" y="324" text-anchor="middle">Review</text>
  <text class="sublabel" x="815" y="342" text-anchor="middle">QC vs brief</text>

  <!-- ai lane -->
  <rect class="external" x="440" y="540" width="150" height="56" rx="6"/>
  <text class="node-name" x="515" y="564" text-anchor="middle">Render</text>
  <text class="sublabel" x="515" y="582" text-anchor="middle">queue · retries</text>
  <rect class="external" x="640" y="540" width="150" height="56" rx="6"/>
  <text class="node-name" x="715" y="564" text-anchor="middle">Refine</text>
  <text class="sublabel" x="715" y="582" text-anchor="middle">upscale · fix takes</text>

  <text class="callout" x="40" y="700">The approval gate is the only place the client's lane touches the work.</text>
</svg>
</body>
</html>
