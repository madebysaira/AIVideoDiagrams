<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character sheet — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Character sheet for a brand ambassador">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Character sheet · brand ambassador</text>

  <!-- portrait frame -->
  <rect class="input" x="60" y="150" width="280" height="400" rx="8"/>
  <text class="eyebrow" x="200" y="180" text-anchor="middle">Anchor shot</text>
  <path class="store" d="M120,420 Q200,352 280,420 Z"/>
  <ellipse class="store" cx="200" cy="272" rx="36" ry="44"/>
  <text class="node-name" x="200" y="510" text-anchor="middle">Keyframe 03</text>
  <text class="sublabel" x="200" y="528" text-anchor="middle">head &amp; shoulders · neutral bg</text>

  <!-- column headers -->
  <text class="eyebrow" x="420" y="180">Look</text>
  <text class="eyebrow" x="680" y="180">Wardrobe</text>
  <text class="eyebrow" x="940" y="180">Voice &amp; manner</text>

  <!-- look rows -->
  <line class="edge-thin" x1="420" y1="280" x2="650" y2="280"/>
  <text class="sublabel" x="420" y="260">Face</text>
  <text class="node-name" x="640" y="260" text-anchor="end">round, soft jaw</text>
  <line class="edge-thin" x1="420" y1="326" x2="650" y2="326"/>
  <text class="sublabel" x="420" y="306">Skin</text>
  <text class="node-name" x="640" y="306" text-anchor="end">warm · #f0d9b8</text>
  <line class="edge-thin" x1="420" y1="372" x2="650" y2="372"/>
  <text class="sublabel" x="420" y="352">Hair</text>
  <text class="node-name" x="640" y="352" text-anchor="end">black, low bun</text>
  <line class="edge-thin" x1="420" y1="418" x2="650" y2="418"/>
  <text class="sublabel" x="420" y="398">Eyes</text>
  <text class="node-name" x="640" y="398" text-anchor="end">dark, kind</text>
  <line class="edge-thin" x1="420" y1="464" x2="650" y2="464"/>
  <text class="sublabel" x="420" y="444">Age</text>
  <text class="node-name" x="640" y="444" text-anchor="end">mid-30s</text>

  <!-- wardrobe rows -->
  <line class="edge-thin" x1="680" y1="280" x2="910" y2="280"/>
  <text class="sublabel" x="680" y="260">Jacket</text>
  <text class="node-name" x="900" y="260" text-anchor="end">olive green</text>
  <line class="edge-thin" x1="680" y1="326" x2="910" y2="326"/>
  <text class="sublabel" x="680" y="306">Top</text>
  <text class="node-name" x="900" y="306" text-anchor="end">cream kurta</text>
  <line class="edge-thin" x1="680" y1="372" x2="910" y2="372"/>
  <text class="sublabel" x="680" y="352">Necklace</text>
  <text class="node-name" x="900" y="352" text-anchor="end">thin gold chain</text>
  <line class="edge-thin" x1="680" y1="418" x2="910" y2="418"/>
  <text class="sublabel" x="680" y="398">Hands</text>
  <text class="node-name" x="900" y="398" text-anchor="end">gestures wide</text>
  <line class="edge-thin" x1="680" y1="464" x2="910" y2="464"/>
  <text class="sublabel" x="680" y="444">Shoes</text>
  <text class="node-name" x="900" y="444" text-anchor="end">neutral flats</text>

  <!-- voice rows -->
  <line class="edge-thin" x1="940" y1="280" x2="1170" y2="280"/>
  <text class="sublabel" x="940" y="260">Tone</text>
  <text class="node-name" x="1160" y="260" text-anchor="end">warm, unhurried</text>
  <line class="edge-thin" x1="940" y1="326" x2="1170" y2="326"/>
  <text class="sublabel" x="940" y="306">Pace</text>
  <text class="node-name" x="1160" y="306" text-anchor="end">90 wpm</text>
  <line class="edge-thin" x1="940" y1="372" x2="1170" y2="372"/>
  <text class="sublabel" x="940" y="352">Laugh</text>
  <text class="node-name" x="1160" y="352" text-anchor="end">soft, nasal</text>
  <line class="edge-thin" x1="940" y1="418" x2="1170" y2="418"/>
  <text class="sublabel" x="940" y="398">Phrase</text>
  <text class="node-name" x="1160" y="398" text-anchor="end">“like this, see?”</text>
  <line class="edge-thin" x1="940" y1="464" x2="1170" y2="464"/>
  <text class="sublabel" x="940" y="444">Avoid</text>
  <text class="node-name" x="1160" y="444" text-anchor="end">sarcasm</text>

  <!-- consistency lock -->
  <rect class="focal" x="60" y="600" width="1110" height="64" rx="8"/>
  <text class="eyebrow" x="84" y="624">Consistency lock</text>
  <text class="node-name" x="84" y="646">Face shape · hair colour · olive jacket · nasal voice — do not change, ever.</text>

  <text class="callout" x="40" y="700">Every attribute is falsifiable: a render either matches or it doesn't.</text>
</svg>
</body>
</html>
