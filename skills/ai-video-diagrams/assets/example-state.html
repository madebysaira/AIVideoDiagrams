<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State machine — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="State machine of a render job lifecycle">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Render job lifecycle</text>

  <!-- happy path -->
  <rect class="node" x="60" y="300" width="180" height="56" rx="28"/>
  <text class="node-name" x="150" y="324" text-anchor="middle">Created</text>
  <text class="sublabel" x="150" y="342" text-anchor="middle">brief parsed</text>
  <path class="edge" d="M240,328 L300,328" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="270" y="320" text-anchor="middle">submit</text>

  <rect class="node" x="300" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="375" y="324" text-anchor="middle">Queued</text>
  <text class="sublabel" x="375" y="342" text-anchor="middle">worker pool</text>
  <path class="edge" d="M450,328 L500,328" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="475" y="320" text-anchor="middle">pickup</text>

  <rect class="focal" x="500" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="575" y="324" text-anchor="middle">Rendering</text>
  <text class="sublabel" x="575" y="342" text-anchor="middle">≈ 90s avg</text>
  <path class="edge" d="M650,328 L700,328" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="675" y="320" text-anchor="middle">done</text>

  <rect class="node" x="700" y="300" width="150" height="56" rx="6"/>
  <text class="node-name" x="775" y="324" text-anchor="middle">Review</text>
  <text class="sublabel" x="775" y="342" text-anchor="middle">QC vs brief</text>
  <path class="edge" d="M850,328 L900,328" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="875" y="320" text-anchor="middle">client ok</text>

  <rect class="ok" x="900" y="300" width="180" height="56" rx="28"/>
  <text class="node-name" x="990" y="324" text-anchor="middle">Approved</text>
  <text class="sublabel" x="990" y="342" text-anchor="middle">written sign-off</text>

  <!-- failure path -->
  <path class="edge" d="M575,356 L575,440" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="583" y="400">error</text>

  <rect class="danger" x="450" y="440" width="200" height="56" rx="6"/>
  <text class="node-name" x="550" y="464" text-anchor="middle">Failed</text>
  <text class="sublabel" x="550" y="482" text-anchor="middle">rendering error</text>

  <path class="edge-link" d="M550,440 L550,420 L375,420 L375,356" marker-end="url(#arrow-link)" stroke-dasharray="4,3"/>
  <text class="arrow-label" x="462" y="412" text-anchor="middle">retry [attempts &lt; 3]</text>

  <path class="edge" d="M450,468 L300,468" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="375" y="460" text-anchor="middle">give up</text>

  <rect class="danger" x="120" y="440" width="180" height="56" rx="6"/>
  <text class="node-name" x="210" y="464" text-anchor="middle">Rejected</text>
  <text class="sublabel" x="210" y="482" text-anchor="middle">dead-end</text>

  <text class="callout" x="40" y="660">Most jobs die in review or rendering. Fail fast, retry once, then talk.</text>
</svg>
</body>
</html>
