<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loop — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="The loop: generate, review, refine, deliver around a style bible">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">The loop · generate → review → refine → deliver</text>

  <!-- hub -->
  <rect class="focal" x="500" y="320" width="200" height="160" rx="12"/>
  <text class="node-name" x="600" y="388" text-anchor="middle">Style bible</text>
  <text class="sublabel" x="600" y="406" text-anchor="middle">characters · palette · prompts</text>

  <!-- stations -->
  <rect class="node" x="525" y="120" width="150" height="56" rx="6"/>
  <text class="node-name" x="600" y="144" text-anchor="middle">Generate</text>
  <text class="sublabel" x="600" y="162" text-anchor="middle">takes from brief</text>
  <rect class="node" x="925" y="372" width="150" height="56" rx="6"/>
  <text class="node-name" x="1000" y="396" text-anchor="middle">Review</text>
  <text class="sublabel" x="1000" y="414" text-anchor="middle">QC vs bible</text>
  <rect class="node" x="525" y="624" width="150" height="56" rx="6"/>
  <text class="node-name" x="600" y="648" text-anchor="middle">Refine</text>
  <text class="sublabel" x="600" y="666" text-anchor="middle">fix · upscale</text>
  <rect class="node" x="125" y="372" width="150" height="56" rx="6"/>
  <text class="node-name" x="200" y="396" text-anchor="middle">Deliver</text>
  <text class="sublabel" x="200" y="414" text-anchor="middle">client package</text>

  <!-- outer ring -->
  <path class="edge-accent" d="M675,148 L880,148 L880,400 L925,400" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="777" y="140" text-anchor="middle">generate</text>
  <path class="edge-accent" d="M1000,428 L1000,560 L675,560 L675,624" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="837" y="552" text-anchor="middle">review</text>
  <path class="edge-accent" d="M525,652 L320,652 L320,400 L275,400" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="422" y="644" text-anchor="middle">refine</text>
  <path class="edge-accent" d="M200,372 L200,234 L600,234 L600,120" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="400" y="226" text-anchor="middle">deliver</text>

  <!-- write-backs -->
  <path class="edge-link" d="M600,176 L600,320" marker-end="url(#arrow-link)" stroke-dasharray="4,3"/>
  <text class="arrow-label" x="608" y="252">log what worked</text>
  <path class="edge-link" d="M925,400 L700,400" marker-end="url(#arrow-link)" stroke-dasharray="4,3"/>
  <text class="arrow-label" x="812" y="392" text-anchor="middle">append to bible</text>
  <path class="edge-link" d="M600,624 L600,480" marker-end="url(#arrow-link)" stroke-dasharray="4,3"/>
  <path class="edge-link" d="M275,400 L500,400" marker-end="url(#arrow-link)" stroke-dasharray="4,3"/>

  <text class="callout" x="40" y="700">Every delivery feeds the bible. The bible makes the next delivery cheaper.</text>
</svg>
</body>
</html>
