<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision tree — AIVideoDiagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Poppins:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f4ee; --paper-2:#efede5; --card:#ffffff;
  --ink:#20242f; --muted:#5b6472; --soft:#8d94a3;
  --rule:rgba(32,36,47,0.14); --rule-solid:#c8c5b8;
  --accent:#4f46e5; --accent-tint:rgba(79,70,229,0.09);
  --link:#0e7490; --ok:#3d7a4e; --danger:#b23a3a;
  --ink-05:rgba(32,36,47,0.05); --ink-03:rgba(32,36,47,0.03);
  --ink-02:rgba(32,36,47,0.02); --ink-30:rgba(32,36,47,0.30); --ink-20:rgba(32,36,47,0.20);
  --muted-10:rgba(91,100,114,0.10); --ok-08:rgba(61,122,78,0.08); --danger-08:rgba(178,58,58,0.08);
  --title:'Fraunces',Georgia,serif; --sans:'Poppins',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:48px;min-height:100vh}
svg{display:block;width:100%;height:auto}
.eyebrow{font-family:var(--mono);font-size:8px;font-weight:500;letter-spacing:0.16em;text-transform:uppercase;fill:var(--soft)}
.node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}
.sublabel{font-family:var(--mono);font-size:9px;fill:var(--soft)}
.arrow-label{font-family:var(--mono);font-size:8px;letter-spacing:0.04em;fill:var(--muted)}
.callout{font-family:var(--title);font-style:italic;font-size:14px;fill:var(--muted)}
.node{fill:var(--card);stroke:var(--ink);stroke-width:1}
.focal{fill:var(--accent-tint);stroke:var(--accent);stroke-width:1.2}
.store{fill:var(--ink-05);stroke:var(--muted);stroke-width:1}
.external{fill:var(--ink-03);stroke:var(--ink-30);stroke-width:1}
.input{fill:var(--muted-10);stroke:var(--soft);stroke-width:1}
.optional{fill:var(--ink-02);stroke:var(--ink-20);stroke-width:1;stroke-dasharray:4,3}
.ok{fill:var(--ok-08);stroke:var(--ok);stroke-width:1}
.danger{fill:var(--danger-08);stroke:var(--danger);stroke-width:1}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;stroke-linejoin:round}
.edge-link{stroke:var(--link);stroke-width:1.2;fill:none}
.edge-accent{stroke:var(--accent);stroke-width:1.2;fill:none}
.edge-thin{stroke:var(--soft);stroke-width:0.8;fill:none}
.stage{fill:var(--paper-2);stroke:var(--rule);stroke-width:1}
</style>
</head>
<body>
<svg viewBox="0 0 1200 720" role="img" aria-label="Model decision tree for a client spot">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/>
    </marker>
    <marker id="arrow-link" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--link)"/>
    </marker>
  </defs>

  <text class="eyebrow" x="40" y="48">Model decision tree · 15s spot</text>

  <!-- start -->
  <rect class="node" x="480" y="42" width="240" height="44" rx="22"/>
  <text class="node-name" x="600" y="62" text-anchor="middle">Client brief: 15s brand spot</text>
  <text class="sublabel" x="600" y="78" text-anchor="middle">read the brief before the model chart</text>
  <path class="edge" d="M600,86 L600,156" marker-end="url(#arrow)"/>

  <!-- decision 1 -->
  <path class="node" d="M600,164 L664,204 L600,244 L536,204 Z"/>
  <text class="node-name" x="600" y="209" text-anchor="middle">Brand-safe?</text>
  <text class="arrow-label" x="676" y="196">yes</text>
  <path class="edge-accent" d="M664,204 L756,204 L756,188 L836,188" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="760" y="180">no license risk</text>
  <text class="arrow-label" x="612" y="258">no</text>
  <path class="edge" d="M600,244 L600,316" marker-end="url(#arrow)"/>

  <!-- leaf: runway -->
  <rect class="node" x="836" y="160" width="300" height="56" rx="6"/>
  <text class="node-name" x="986" y="184" text-anchor="middle">Runway Gen-4</text>
  <text class="sublabel" x="986" y="202" text-anchor="middle">licensed training data · mid-motion ok</text>

  <!-- decision 2 -->
  <path class="node" d="M600,324 L664,364 L600,404 L536,364 Z"/>
  <text class="node-name" x="600" y="369" text-anchor="middle">Motion level?</text>
  <text class="arrow-label" x="676" y="356">high</text>
  <path class="edge-accent" d="M664,364 L756,364 L756,348 L836,348" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="742" y="340">action + camera moves</text>
  <text class="arrow-label" x="612" y="418">low · locked-off</text>
  <path class="edge-accent" d="M600,404 L600,476" marker-end="url(#arrow)"/>

  <!-- leaf: kling -->
  <rect class="node" x="836" y="320" width="300" height="56" rx="6"/>
  <text class="node-name" x="986" y="344" text-anchor="middle">Kling 2.1</text>
  <text class="sublabel" x="986" y="362" text-anchor="middle">fast · handles action · 5s takes</text>

  <!-- leaf: veo (focal — the recommended default) -->
  <rect class="focal" x="450" y="484" width="300" height="56" rx="6"/>
  <text class="node-name" x="600" y="508" text-anchor="middle">Veo 3.1 — default pick</text>
  <text class="sublabel" x="600" y="526" text-anchor="middle">cinematic · prompt-faithful · 4K</text>

  <text class="callout" x="40" y="660">Motion and brand-safety decide more than model loyalty ever will.</text>
</svg>
</body>
</html>
